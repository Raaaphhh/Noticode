name: Noticode
options:
  bundleIdPrefix: com.noticode
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Noticode:
    type: application
    platform: macOS
    sources:
      - Noticode
    info:
      path: Noticode/Info.plist
      properties:
        CFBundleName: Noticode
        CFBundleDisplayName: Noticode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true   # pas d'icône dans le Dock, seulement la barre de menus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noticode.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Noticode/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Noticode:
    build:
      targets:
        Noticode: all
